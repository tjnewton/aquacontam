<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contamination Flow Field — AquaContam</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.7.0/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 22px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 13px;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .control-section { margin-bottom: 28px; }

        .control-section h3 {
            font-size: 15px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '\2022';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button { margin-bottom: 0; }

        .control-group { margin-bottom: 18px; }

        .control-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 6px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 48px;
            text-align: right;
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover { background: #c86641; transform: translateY(-1px); }
        .button:active { transform: translateY(0); }
        .button.secondary { background: var(--anthropic-blue); }
        .button.secondary:hover { background: #5a8bb8; }
        .button.tertiary { background: var(--anthropic-green); }
        .button.tertiary:hover { background: #6b7b52; }

        .button-row { display: flex; gap: 8px; }
        .button-row .button { flex: 1; }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1200px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.15);
            background: #0d1117;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            color: var(--anthropic-mid-gray);
            padding: 60px;
        }

        .progress-bar {
            width: 100%;
            height: 6px;
            background: var(--anthropic-light-gray);
            border-radius: 3px;
            overflow: hidden;
            margin-top: 8px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--anthropic-blue), var(--anthropic-orange));
            border-radius: 3px;
            transition: width 0.1s ease;
            width: 0%;
        }

        @media (max-width: 768px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="sidebar">
            <h1>Contamination Flow Field</h1>
            <div class="subtitle">Perlin noise flow visualization of PFAS contamination spread through U.S. drinking water aquifers</div>

            <!-- Seed Section -->
            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">&larr; Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next &rarr;</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">&circlearrowright; Random</button>
            </div>

            <!-- Parameters Section -->
            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particles</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="500" max="6000" step="250" value="3000" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">3000</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Scale</label>
                    <div class="slider-container">
                        <input type="range" id="noiseScale" min="0.02" max="0.30" step="0.01" value="0.08" oninput="updateParam('noiseScale', this.value)">
                        <span class="value-display" id="noiseScale-value">0.08</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Flow Speed</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0.5" max="3.0" step="0.1" value="1.5" oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">1.5</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Opacity</label>
                    <div class="slider-container">
                        <input type="range" id="trailAlpha" min="3" max="40" step="1" value="12" oninput="updateParam('trailAlpha', this.value)">
                        <span class="value-display" id="trailAlpha-value">12</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Hotspots</label>
                    <div class="slider-container">
                        <input type="range" id="hotspotCount" min="2" max="7" step="1" value="4" oninput="updateParam('hotspotCount', this.value)">
                        <span class="value-display" id="hotspotCount-value">4</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Stations</label>
                    <div class="slider-container">
                        <input type="range" id="stationCount" min="10" max="100" step="5" value="50" oninput="updateParam('stationCount', this.value)">
                        <span class="value-display" id="stationCount-value">50</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Render Frames</label>
                    <div class="slider-container">
                        <input type="range" id="totalFrames" min="200" max="800" step="50" value="500" oninput="updateParam('totalFrames', this.value)">
                        <span class="value-display" id="totalFrames-value">500</span>
                    </div>
                </div>
            </div>

            <!-- Actions Section -->
            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row" style="margin-bottom: 8px;">
                    <button class="button" onclick="regenerate()">Regenerate</button>
                    <button class="button secondary" onclick="resetParameters()">Reset</button>
                </div>
                <button class="button tertiary" onclick="downloadPNG()" style="margin-top: 8px;">&darr; Download PNG</button>
            </div>

            <!-- Progress -->
            <div class="control-section">
                <h3>Progress</h3>
                <div style="font-family: 'Courier New', monospace; font-size: 12px; color: var(--anthropic-mid-gray);">
                    Frame <span id="frame-display">0</span> / <span id="total-display">500</span>
                </div>
                <div class="progress-bar">
                    <div class="progress-fill" id="progress-fill"></div>
                </div>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Generating contamination flow field...</div>
            </div>
        </div>
    </div>

    <script>
        // ═════════════════════════════════════════════════════════════
        // PARAMETERS
        // ═════════════════════════════════════════════════════════════

        let params = {
            seed: 42,
            particleCount: 3000,
            noiseScale: 0.08,
            flowSpeed: 1.5,
            trailAlpha: 12,
            hotspotCount: 4,
            stationCount: 50,
            totalFrames: 500,
            timeEvolution: 0.0008
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        // ═════════════════════════════════════════════════════════════
        // STATE
        // ═════════════════════════════════════════════════════════════

        let particles = [];
        let hotspots = [];
        let stationsList = [];
        let flowField = [];
        let cols, rows;
        let cellSize = 20;
        let zoff = 0;
        let cleanPalette, contaminatedPalette;
        let stationsDrawn = false;
        let currentFrame = 0;

        // Global flag for headless export
        window.animationDone = false;

        // ═════════════════════════════════════════════════════════════
        // CONTAMINATION ZONE
        // ═════════════════════════════════════════════════════════════

        class ContaminationZone {
            constructor() {
                this.x = random(120, width - 120);
                this.y = random(60, height - 60);
                this.radius = random(80, 200);
                this.intensity = random(0.65, 1.0);
            }

            getContamination(px, py) {
                let d = dist(px, py, this.x, this.y);
                if (d >= this.radius) return 0;
                let falloff = 1 - d / this.radius;
                return pow(falloff, 1.5) * this.intensity;
            }
        }

        // ═════════════════════════════════════════════════════════════
        // PARTICLE
        // ═════════════════════════════════════════════════════════════

        class FlowParticle {
            constructor() {
                this.pos = createVector(random(width), random(height));
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.prevPos = this.pos.copy();
                this.maxSpeed = params.flowSpeed + random(-0.4, 0.4);
                this.strokeW = random(0.5, 1.5);
                this.colorMix = random(1);
            }

            follow() {
                let x = constrain(floor(this.pos.x / cellSize), 0, cols - 1);
                let y = constrain(floor(this.pos.y / cellSize), 0, rows - 1);
                let force = flowField[x + y * cols];
                if (force) {
                    this.acc.add(force);
                }
            }

            update() {
                this.prevPos.set(this.pos);
                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);

                // Wrap edges
                if (this.pos.x > width)  { this.pos.x = 0;     this.prevPos.x = this.pos.x; }
                if (this.pos.x < 0)      { this.pos.x = width;  this.prevPos.x = this.pos.x; }
                if (this.pos.y > height)  { this.pos.y = 0;      this.prevPos.y = this.pos.y; }
                if (this.pos.y < 0)       { this.pos.y = height;  this.prevPos.y = this.pos.y; }
            }

            display() {
                // Calculate contamination influence at current position
                let contamination = 0;
                for (let h of hotspots) {
                    contamination = max(contamination, h.getContamination(this.pos.x, this.pos.y));
                }

                // Determine color
                let cleanIdx = floor(this.colorMix * cleanPalette.length) % cleanPalette.length;
                let baseColor = cleanPalette[cleanIdx];
                let c;

                if (contamination > 0.01) {
                    if (contamination < 0.5) {
                        c = lerpColor(baseColor, contaminatedPalette[0], contamination * 2);
                    } else {
                        c = lerpColor(contaminatedPalette[0], contaminatedPalette[1], (contamination - 0.5) * 2);
                    }
                } else {
                    c = baseColor;
                }

                stroke(red(c), green(c), blue(c), params.trailAlpha);
                strokeWeight(this.strokeW);
                line(this.prevPos.x, this.prevPos.y, this.pos.x, this.pos.y);
            }
        }

        // ═════════════════════════════════════════════════════════════
        // P5.JS LIFECYCLE
        // ═════════════════════════════════════════════════════════════

        function setup() {
            let canvas = createCanvas(1200, 400);
            canvas.parent('canvas-container');
            pixelDensity(1);

            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            noiseDetail(4, 0.5);

            background(13, 17, 23); // #0d1117

            // Color palettes
            cleanPalette = [
                color(10, 36, 99),     // #0a2463 — deep navy
                color(30, 96, 145),    // #1e6091 — ocean blue
                color(22, 138, 173)    // #168aad — teal
            ];
            contaminatedPalette = [
                color(214, 40, 40),    // #d62828 — alarm red
                color(247, 127, 0)     // #f77f00 — warning orange
            ];

            // Generate contamination hotspots
            hotspots = [];
            for (let i = 0; i < params.hotspotCount; i++) {
                hotspots.push(new ContaminationZone());
            }

            // Generate flow field
            cols = floor(width / cellSize);
            rows = floor(height / cellSize);
            flowField = new Array(cols * rows);
            zoff = 0;
            updateFlowField();

            // Generate particles
            particles = [];
            for (let i = 0; i < params.particleCount; i++) {
                particles.push(new FlowParticle());
            }

            // Generate monitoring stations
            stationsList = [];
            for (let i = 0; i < params.stationCount; i++) {
                stationsList.push({
                    x: random(30, width - 30),
                    y: random(15, height - 15)
                });
            }

            // Draw subtle hotspot glow
            drawHotspotGlow();

            stationsDrawn = false;
            currentFrame = 0;
            window.animationDone = false;
        }

        function updateFlowField() {
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    let angle = noise(x * params.noiseScale, y * params.noiseScale, zoff) * TWO_PI * 2;
                    let idx = x + y * cols;
                    flowField[idx] = p5.Vector.fromAngle(angle);
                    flowField[idx].setMag(1);
                }
            }
        }

        function drawHotspotGlow() {
            noStroke();
            for (let h of hotspots) {
                let steps = floor(h.radius / 3);
                for (let i = steps; i > 0; i--) {
                    let r = (i / steps) * h.radius;
                    let a = pow(1 - i / steps, 2.5) * 5;
                    fill(120, 25, 25, a);
                    ellipse(h.x, h.y, r * 2, r * 2);
                }
            }
        }

        function drawMonitoringStations() {
            let connectionDist = 180;

            // Connection lines
            strokeWeight(0.5);
            for (let i = 0; i < stationsList.length; i++) {
                for (let j = i + 1; j < stationsList.length; j++) {
                    let d = dist(stationsList[i].x, stationsList[i].y,
                                 stationsList[j].x, stationsList[j].y);
                    if (d < connectionDist) {
                        let a = map(d, 0, connectionDist, 18, 3);
                        stroke(255, 255, 255, a);
                        line(stationsList[i].x, stationsList[i].y,
                             stationsList[j].x, stationsList[j].y);
                    }
                }
            }

            // Station dots
            noStroke();
            for (let s of stationsList) {
                // Outer glow
                fill(255, 255, 255, 15);
                ellipse(s.x, s.y, 8, 8);
                // Inner dot
                fill(255, 255, 255, 55);
                ellipse(s.x, s.y, 3, 3);
            }
        }

        function draw() {
            // Slowly evolve the flow field
            updateFlowField();
            zoff += params.timeEvolution;

            // Update and render all particles
            for (let p of particles) {
                p.follow();
                p.update();
                p.display();
            }

            currentFrame++;

            // Draw monitoring stations near the end
            if (currentFrame >= params.totalFrames - 20 && !stationsDrawn) {
                drawMonitoringStations();
                stationsDrawn = true;
            }

            // Update progress UI
            if (currentFrame % 10 === 0) {
                document.getElementById('frame-display').textContent = currentFrame;
                let pct = min(100, (currentFrame / params.totalFrames) * 100);
                document.getElementById('progress-fill').style.width = pct + '%';
            }

            // Stop after target frames
            if (currentFrame >= params.totalFrames) {
                document.getElementById('frame-display').textContent = params.totalFrames;
                document.getElementById('progress-fill').style.width = '100%';
                window.animationDone = true;
                noLoop();
            }
        }

        // ═════════════════════════════════════════════════════════════
        // UI HANDLERS
        // ═════════════════════════════════════════════════════════════

        function updateParam(name, value) {
            let v = parseFloat(value);
            params[name] = v;
            document.getElementById(name + '-value').textContent = v;
            if (name === 'totalFrames') {
                document.getElementById('total-display').textContent = v;
            }
        }

        function regenerate() {
            initializeSystem();
            loop();
        }

        function downloadPNG() {
            saveCanvas('contamination-flow-field-seed' + params.seed, 'png');
        }

        // ═════════════════════════════════════════════════════════════
        // SEED CONTROLS
        // ═════════════════════════════════════════════════════════════

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                regenerate();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            regenerate();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            regenerate();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            regenerate();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));

            // Update all UI controls
            let sliders = ['particleCount', 'noiseScale', 'flowSpeed', 'trailAlpha',
                           'hotspotCount', 'stationCount', 'totalFrames'];
            for (let s of sliders) {
                document.getElementById(s).value = params[s];
                document.getElementById(s + '-value').textContent = params[s];
            }
            document.getElementById('total-display').textContent = params.totalFrames;

            updateSeedDisplay();
            regenerate();
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
