repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=5120"]
      - id: no-commit-to-branch
        args: ["--branch", "main"]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.12
    hooks:
      - id: ruff
        args: ["--fix"]
      - id: ruff-format

  # mypy runs from the project environment (same interpreter, deps, and version as the
  # CI typecheck job). A mirrors-mypy isolated env cannot resolve the project's imports
  # without duplicating the whole dependency tree.
  - repo: local
    hooks:
      - id: mypy
        name: mypy (project env)
        entry: mypy src/aquacontam/
        language: system
        types: [python]
        pass_filenames: false
