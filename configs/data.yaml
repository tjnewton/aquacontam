# ---------------------------------------------------------------------------
# EPA Toxics Release Inventory (TRI) — PFAS releases (feature source)
# ---------------------------------------------------------------------------
tri:
  url_template: "https://data.epa.gov/efservice/downloads/tri/mv_tri_basic_download/{year}_US/csv"
  years:
    - 2023
    - 2022
    - 2021
    - 2020
  expected_files:
    - "tri_pfas_facilities.csv"
  format:
    encoding: "utf-8"
  # TRI has a "48. PFAS" column = "YES" for PFAS chemicals.
  # Key columns: 12. LATITUDE, 13. LONGITUDE, 37. CHEMICAL, 65. ON-SITE RELEASE TOTAL

# ---------------------------------------------------------------------------
# Minnesota MDH — PFAS monitoring (manual bulk export; no public API/download)
# ---------------------------------------------------------------------------
# No public bulk-download endpoint — MDH provides an Excel export on request
# (health.drinkingwater@state.mn.us). Stage the workbook at
# data/raw/mn_mdh_pfas.xlsx (the loader also accepts the original emailed name).
# 410,363 raw rows -> 247,230 after collapsing the ANALYTE_GROUP replication
# (PFAS_533 / PFC_EXPANDED / PFAS_Regulated). 1,357 PWS systems, 27 PFAS
# analytes, 2005-2026, ~79% non-detect (RESULT == REPORTING_LIMIT substitution).
mn_mdh:
  url: "https://www.health.state.mn.us/communities/environment/water/pfasmap.html"
  manual_export_file: "mn_mdh_pfas.xlsx"
  unit: "mixed"  # ng/L and ug/L both present; converted per-row to ug/L
  expected_files:
    - "mn_mdh_pfas.xlsx"

# ---------------------------------------------------------------------------
# Maine CDC — PFAS drinking water testing via MaineTracking Network
# ---------------------------------------------------------------------------
me_cdc:
  url: "https://data.mainepublichealth.gov/tracking/public-water"
  unavailable: true
  unavailable_reason: >-
    Maine CDC PFAS data is available via MaineTracking Network interactive
    portal with CSV export capability. 383 community water systems + 272
    schools tested (Aug 2021 - Oct 2024). 6 PFAS: PFOA, PFOS, PFHpA, PFNA,
    PFDA, PFHxS. Maine standard = 20 ppt combined. Manual download required
    from the portal. Contact data.mainepublichealth.gov for programmatic access.
  expected_files:
    - "me_cdc_pfas.csv"
  format:
    encoding: "utf-8"

# ---------------------------------------------------------------------------
# DoD PFAS Sites — EPA PFAS Analytic Tools, Layer 13 (Federal Sites)
# ---------------------------------------------------------------------------
dod_pfas:
  arcgis_url: "https://services.arcgis.com/cJ9YHowT8TU7DUyn/ArcGIS/rest/services/PFAS_Analytic_Tools_Layers/FeatureServer/13"
  expected_files:
    - "dod_pfas_sites.csv"
  format:
    encoding: "utf-8"
  # 761 federal sites (724 DoD/military) with known or suspected PFAS
  # contamination. Agencies: Army, Air Force, Navy, DLA, FUDS, USCG, DOE,
  # DOT FAA, NASA, USDA. Includes lat/lon, PFAS presence, cleanup status.
