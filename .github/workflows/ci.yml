name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job carries a hard timeout-minutes: a hung runner step (observed 2026-08-17:
# apt-get stalled indefinitely on two jobs) otherwise runs to GitHub's 6-hour default,
# burning ~360 private-repo Actions minutes per job before auto-cancel.
jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff==0.15.12
      - run: ruff check src/ tests/
      - run: ruff format --check src/ tests/

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install GDAL system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgdal-dev gdal-bin
      - name: Install dependencies
        run: pip install --prefer-binary -e ".[test]"
      - name: Run unit tests
        run: |
          pytest tests/unit/ \
            --ignore=tests/unit/test_pipeline_analysis.py \
            --ignore=tests/unit/test_pipeline_core.py \
            --ignore=tests/unit/test_reproduce_stages.py \
            -x --tb=short -q
        timeout-minutes: 15

  test-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgdal-dev gdal-bin
      - name: Install dependencies
        run: pip install --prefer-binary -e ".[test]"
      - name: Run pipeline tests
        run: |
          pytest tests/unit/test_pipeline_analysis.py \
            tests/unit/test_pipeline_core.py \
            tests/unit/test_reproduce_stages.py \
            -x --tb=short -q
        timeout-minutes: 30

  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install --prefer-binary -e ".[dev,test]"
      - run: mypy src/aquacontam/

  final-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GDAL system libraries
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libgdal-dev gdal-bin
      - name: Install dependencies
        # [gate] extra = the gate's toolchain beyond [test]: tabulate (G4 df.to_markdown),
        # python-docx (G5 fixtures; the G12 clause reads DOCX via stdlib zipfile). jinja2
        # (G4 df.to_latex) and openpyxl are core deps. Declared in pyproject so a new gate
        # dep is a pyproject edit, not another workflow edit.
        run: pip install --prefer-binary -e ".[test,gate]"
      - name: Full paper gate (calibrated-red aware while paper/EXPECTED_RED.json exists)
        run: python paper/final_gate.py --check
        timeout-minutes: 20
